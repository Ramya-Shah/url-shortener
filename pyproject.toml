[project]
name = "url-shortener"
version = "0.1.0"
description = "Production-grade URL shortener"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "bcrypt>=4.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
